<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arknights: Endfield - Auto Check-In</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0d14;
            color: #e8ecf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(251, 146, 60, 0.06) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Grid pattern overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        .container {
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Header Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 36px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #38bdf8 0%, #fb923c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Card */
        .card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 32px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow:
                0 0 40px rgba(56, 189, 248, 0.1),
                inset 0 0 60px rgba(56, 189, 248, 0.02);
            position: relative;
            overflow: hidden;
        }

        /* Card glow effect */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.15);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #38bdf8;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            color: #e8ecf0;
            font-size: 14px;
            font-family: 'Inter', monospace;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        .form-input::placeholder {
            color: #475569;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(56, 189, 248, 0.5);
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Info Box */
        .info-box {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .info-box-icon {
            display: inline-block;
            margin-right: 8px;
            color: #38bdf8;
        }

        /* Link Card */
        .link-card {
            margin-top: 24px;
            padding: 16px;
            background: rgba(251, 146, 60, 0.05);
            border: 1px solid rgba(251, 146, 60, 0.15);
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s;
        }

        .link-card:hover {
            background: rgba(251, 146, 60, 0.08);
            border-color: rgba(251, 146, 60, 0.3);
            transform: translateY(-2px);
        }

        .link-card-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .link-card a {
            color: #fb923c;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .link-card a:hover {
            color: #fdba74;
            gap: 10px;
        }

        /* Success Message */
        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 32px;
            color: #475569;
            font-size: 12px;
        }

        .footer-schedule {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(56, 189, 248, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.1);
            margin-top: 8px;
        }

        .footer-schedule-icon {
            color: #38bdf8;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo-section">
            <div class="logo-title">Endfield</div>
            <div class="logo-subtitle">Auto Check-In Service</div>
        </div>

        <!-- Main Card -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">🔐</div>
                <div class="card-title">Account Setup</div>
            </div>

            <div class="info-box">
                <span class="info-box-icon">ℹ️</span>
                Obtén tu token desde DevTools → Application → Cookies → .skport.com → <strong>ACCOUNT_TOKEN</strong>
            </div>

            <form id="configForm">
                <div class="form-group">
                    <label class="form-label" for="token">Account Token</label>
                    <input type="password" id="token" class="form-input" placeholder="Ingresa tu ACCOUNT_TOKEN aquí"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">
                    💾 Guardar Configuración
                </button>
            </form>

            <!-- Official Link -->
            <div class="link-card">
                <div class="link-card-label">🌐 Página Oficial</div>
                <a href="https://game.skport.com/endfield/sign-in" target="_blank">
                    game.skport.com/endfield/sign-in
                    <span>→</span>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-schedule">
                <span class="footer-schedule-icon">⏰</span>
                <span>Check-in automático diario a las 20:00 UTC</span>
            </div>
        </div>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="successMessage">
        ✅ Configuración guardada correctamente
    </div>

    <script>
        // Load existing config on page load
        window.addEventListener('DOMContentLoaded', loadConfig);

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();

                if (data.success && data.config && data.config.account_token) {
                    // Show masked token if one exists
                    document.getElementById('token').value = '••••••••••••••••';
                    document.getElementById('token').placeholder = 'Token configurado ✓';
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        // Handle form submission
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('token').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Don't update if it's the masked value
            if (token === '••••••••••••••••') {
                showSuccess('Token ya configurado');
                return;
            }

            if (!token || token.trim() === '') {
                alert('Por favor ingresa tu ACCOUNT_TOKEN');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Guardando...';

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account_token: token })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Configuración guardada correctamente');
                    loadConfig();

                    // Clear input after saving
                    setTimeout(() => {
                        document.getElementById('token').value = '';
                        loadConfig();
                    }, 500);
                } else {
                    alert('❌ Error: ' + data.message);
                }
            } catch (error) {
                alert('❌ Error al guardar: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '💾 Guardar Configuración';
            }
        });

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = '✅ ' + message;
            successEl.classList.add('show');

            setTimeout(() => {
                successEl.classList.remove('show');
            }, 3000);
        }
    </script>
</body>

</html>
