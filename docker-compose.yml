version: '3.8'

services:
  endfield-checkin:
    build: .
    container_name: endfield-auto-checkin
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist database
      - ./data:/app/data
    environment:
      # OPTIONAL: Timezone for logs (default: UTC)
      - TZ=UTC

      # OPTIONAL: Custom database path
      - DB_PATH=/app/data/database.db

      # OPTIONAL: Custom port (default: 3000)
      - PORT=3000

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
